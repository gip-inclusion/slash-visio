version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      # Auto-merged once CI is green (see .github/workflows/dependabot-auto-merge.yml).
      # Majors stay out of the group so each one gets its own PR and a human review.
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.x requires typescript < 6.1
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
